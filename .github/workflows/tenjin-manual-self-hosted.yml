name: Tenjin Manual Update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tenjin-manual-update
  cancel-in-progress: false

jobs:
  update:
    name: Query Tenjin and update results
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout jpwork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Actions commit identity
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Query Tenjin from Kevin PC
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\run-tenjin-local-sync.ps1 -Slot manual
