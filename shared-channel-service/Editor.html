<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f4efe7;color:#222;font-family:Arial,"Microsoft JhengHei",sans-serif}main{max-width:1120px;margin:auto}header,.card{background:#fffdf8;border:1px solid #e8e0d5;border-radius:18px;padding:24px;margin-bottom:18px}h1{font-size:26px;margin:0 0 10px}h2{font-size:20px;margin:0}p{line-height:1.6;color:#6a6257}button,a,input,select,textarea{font:inherit}button{padding:11px 16px;border:0;border-radius:9px;cursor:pointer;background:#eee3d4}button:disabled{opacity:.45;cursor:default}.primary{background:#244f78;color:white}input,select,textarea{width:100%;min-width:0;padding:12px;border:1px solid #d7ccbe;border-radius:8px;background:white;color:#222}label{display:block;font-weight:700;font-size:14px;margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.full{grid-column:1/-1}.row{display:flex;align-items:center;gap:10px}.row input{flex:1;min-width:0}.row button{white-space:nowrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar p{flex:1}.status{color:#244f78;white-space:pre-wrap;font-size:13px}.hint{font-size:13px}a{color:#244f78}#rows>div{display:grid;grid-template-columns:1fr 1.8fr 60px;gap:10px;margin:10px 0}footer{position:sticky;bottom:0;background:#fffdf8;padding:15px 0;display:flex;gap:10px}#builder[hidden],#editor[hidden],[hidden]{display:none!important}#result{background:#eaf0f5}textarea{resize:vertical;min-height:100px}#source{width:auto;padding:6px 8px;font-size:12px;margin-left:auto}#query-status{min-height:20px;margin-bottom:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #244f78;outline-offset:2px}@media(max-width:650px){body{padding:10px}header,.card{padding:18px}.grid{grid-template-columns:1fr}#rows>div{grid-template-columns:1fr 60px}#rows input:nth-child(2){grid-column:1/-1;grid-row:2}.row button{padding:11px 9px}}
</style></head><body><main>
<header><h1>PWA 共用 URL 拼接</h1><p id="account" class="hint">正在驗證 Google 資料夾權限…</p><div class="toolbar"><button id="reload">重新同步渠道</button><button id="manage" disabled>管理共用渠道</button><a href="https://docs.google.com/spreadsheets/d/1q0fj4U4wxAyQNyZA_U9Gldz5ffz7e0K_rh5YDMs2NAE/edit" target="_blank" rel="noopener">開啟共用 Google Sheet</a><a href="https://abeno-kk.github.io/jpwork/" target="_blank" rel="noopener">返回儀表板</a></div><p id="status" class="status" role="status"></p></header>
<section id="builder" hidden><div class="card grid"><div><div class="row"><label for="channel">渠道</label><select id="source" aria-label="渠道來源"><option value="shared">共用渠道</option><option value="manual">手動網址</option></select></div><select id="channel"></select><input id="custom" placeholder="https://你的渠道網址" aria-label="手動渠道網址" hidden><p id="domain" class="hint"></p></div><div><label for="aid">AID</label><input id="aid" inputmode="numeric" placeholder="例如：135010119" autocomplete="off"></div><div class="full"><label for="uid">UID</label><div class="row"><input id="uid" inputmode="numeric" placeholder="例如：101025912" autocomplete="off"><button id="query">查詢 TOKEN</button></div><p id="query-status" class="status" role="status"></p></div><div class="full"><label for="token">TOKEN（可自動查詢或手動貼上）</label><input id="token" autocomplete="off" spellcheck="false"></div></div><div id="result" class="card"><label for="output">完整網址</label><textarea id="output" readonly></textarea><div class="toolbar"><p id="result-status" class="status" role="status"></p><button id="clear">清空輸入</button><button id="copy" class="primary" disabled>複製網址</button></div></div></section>
<section id="editor" class="card" hidden><h2>管理共用渠道</h2><p class="hint">新增、修改或刪除後儲存。其他同事按「重新同步渠道」即可看到。</p><div id="rows"></div><footer><button id="add">＋ 新增渠道</button><button id="cancel">取消</button><button id="save" class="primary">儲存共用清單</button></footer><p id="edit-status" class="status" role="status"></p></section>
</main><script>
const $=id=>document.getElementById(id);let channels=[],draft=[],revision='',editingRevision='',canEdit=false,busy=false,requestId=0,queriedUid='';
function message(text){$('status').textContent=text;}function toggle(b){busy=b;$('save').disabled=b;$('add').disabled=b;$('manage').disabled=b||!canEdit;document.querySelectorAll('#rows input,#rows button').forEach(e=>e.disabled=b);}
function domain(raw){const u=new URL(raw.trim());if(!['http:','https:'].includes(u.protocol)||u.username||u.password||raw.includes('?')||raw.includes('#'))throw Error('請輸入完整 http(s) 網址，不含參數或帳密。');return u.href.replace(/\/$/,'');}
function update(){let base='',error='';try{base=$('source').value==='manual'?($('custom').value.trim()?domain($('custom').value):''):channels.find(r=>r.id===$('channel').value)?.url||'';}catch{error='請輸入完整 http(s) 網址，不含參數或帳密。';}const aid=$('aid').value.trim(),token=$('token').value.trim();$('domain').textContent=base||error;$('output').value=base&&/^\d+$/.test(aid)&&token&&!/\s/.test(token)?base+'?aid='+encodeURIComponent(aid)+'&login_token='+encodeURIComponent(token):'';$('copy').disabled=!$('output').value;$('result-status').textContent=error||(aid&&!/^\d+$/.test(aid)?'AID 請填入純數字。':'');}
function populate(){const selected=$('channel').value;$('channel').replaceChildren(...channels.map(r=>new Option(r.name,r.id)));if(channels.some(r=>r.id===selected))$('channel').value=selected;update();}
function draw(){$('rows').replaceChildren();draft.forEach((row,index)=>{const wrap=document.createElement('div'),name=document.createElement('input'),url=document.createElement('input'),remove=document.createElement('button');name.value=row.name;name.placeholder='渠道名稱';name.setAttribute('aria-label','渠道名稱 '+(index+1));url.value=row.url;url.placeholder='https://';url.setAttribute('aria-label','渠道網址 '+(index+1));name.oninput=()=>row.name=name.value;url.oninput=()=>row.url=url.value;remove.textContent='刪除';remove.disabled=draft.length<=1;remove.onclick=()=>{draft.splice(index,1);draw();};wrap.append(name,url,remove);$('rows').append(wrap);});}
function load(){if(!$('editor').hidden&&!confirm('重新同步會放棄未儲存的渠道修改，繼續？'))return;$('editor').hidden=true;toggle(true);message('正在驗證資料夾權限並讀取渠道…');google.script.run.withSuccessHandler(data=>{channels=data.channels;revision=data.revision;canEdit=data.canEdit;$('account').textContent='已登入：'+data.email+' · '+(canEdit?'可編輯':'僅檢視');$('builder').hidden=false;populate();toggle(false);message('已同步 '+channels.length+' 個共用渠道。');}).withFailureHandler(e=>{channels=[];revision='';canEdit=false;$('builder').hidden=true;$('editor').hidden=true;$('token').value='';$('output').value='';requestId++;toggle(false);message(e.message||String(e));}).loadEditor();}
$('source').onchange=()=>{const manual=$('source').value==='manual';$('channel').hidden=manual;$('custom').hidden=!manual;update();};for(const id of ['channel','custom','aid','token'])$(id).addEventListener('input',update);
$('uid').oninput=()=>{requestId++;$('query').disabled=false;if(queriedUid){$('token').value='';queriedUid='';update();}$('query-status').textContent='';};$('token').addEventListener('input',()=>{requestId++;$('query').disabled=false;queriedUid='';$('query-status').textContent='手動輸入 TOKEN。';});
$('query').onclick=()=>{const uid=$('uid').value.trim();if(!/^\d+$/.test(uid)){$('query-status').textContent='請填入純數字 UID。';return;}const id=++requestId;$('token').value='';queriedUid='';update();$('query').disabled=true;$('query-status').textContent='查詢中…';google.script.run.withSuccessHandler(r=>{if(id!==requestId)return;$('token').value=r.token;queriedUid=uid;$('query').disabled=false;$('query-status').textContent='已取得 UID '+uid+' 的 TOKEN。';update();}).withFailureHandler(e=>{if(id!==requestId)return;$('query').disabled=false;$('query-status').textContent=e.message||String(e);}).lookupToken(uid);};$('uid').onkeydown=e=>{if(e.key==='Enter'){$('query').click();e.preventDefault();}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);$('result-status').textContent='已複製網址。';}catch{$('output').focus();$('output').select();$('result-status').textContent=document.execCommand('copy')?'已複製網址。':'請按 Ctrl+C 複製。';}};$('clear').onclick=()=>{requestId++;queriedUid='';for(const id of ['aid','uid','token','custom'])$(id).value='';$('query').disabled=false;$('query-status').textContent='';update();};
$('manage').onclick=()=>{draft=structuredClone(channels);editingRevision=revision;draw();$('editor').hidden=false;$('edit-status').textContent='';$('editor').scrollIntoView({behavior:'smooth'});};$('cancel').onclick=()=>{$('editor').hidden=true;};$('add').onclick=()=>{draft.push({id:'pwa-'+crypto.randomUUID(),name:'',url:'https://'});draw();$('rows').lastChild.querySelector('input').focus();};$('save').onclick=()=>{toggle(true);$('edit-status').textContent='儲存中…';google.script.run.withSuccessHandler(data=>{channels=data.channels;revision=data.revision;populate();toggle(false);$('editor').hidden=true;message('已儲存共用渠道，其他同事重新同步即可看到。');}).withFailureHandler(e=>{toggle(false);$('edit-status').textContent=e.message||String(e);}).saveChannels(draft,editingRevision);};$('reload').onclick=load;load();
</script></body></html>
